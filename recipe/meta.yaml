{% set name = "python-lmdb" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # GitHub tag py-lmdb_{{ version }}; PyPI project name is "lmdb"
  url: https://github.com/jnwatson/py-{{ name.split('-')[1] }}/archive/refs/tags/py-{{ name.split('-')[1] }}_{{ version }}.tar.gz
  sha256: 674474011f9947c5b22b24e5cc8995d8c759d8e697cf273770dff3984f88a9ec
  patches:  # [win]
    # MSVC lacks pid_t; still required on 2.3.0 (cpython.c uses pid_t for fork/pid cache)
    - patches/0001-typedef-pid_t-on-win.patch  # [win]

build:
  number: 0
  # upstream python_requires>=3.9 (2.0.0+)
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - setuptools
    - wheel
    # pyproject build-system + CFFI backend path; CPython default build does not link it
    - cffi >=0.8
    - patch-ng  # [win]
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - lmdb
  commands:
    - pip check
    # LMDB page-layout / CVE harnesses assume x86_64 page geometry; on
    # linux-aarch64 LEAF2 pages are not produced and tree depth stays <3.
    - pytest tests  # [not (linux and aarch64)]
    - pytest tests --deselect=tests/cve_test.py::Leaf2KeySizeTest::test_corrupt_mp_pad_huge --deselect=tests/cve_test.py::Leaf2KeySizeTest::test_corrupt_mp_pad_zero --deselect=tests/cve_test.py::PageSplitNodeDszTest::test_corrupt_nodedsz_triggers_split_error --deselect=tests/mdb_layout_test.py::BranchPageTest::test_deep_tree  # [linux and aarch64]
  requires:
    - pip
    - pytest

about:
  home: https://github.com/jnwatson/py-lmdb
  license: OLDAP-2.8
  license_family: Other
  license_file: LICENSE
  summary: Universal Python binding for the LMDB 'Lightning' Database
  description: |
    LMDB is a fast, memory-efficient, embedded key-value store (it does
    not require running an external daemon).
    With memory-mapped files, it has the read performance of a pure
    in-memory database while retaining the persistence of standard
    disk-based databases.
    python-lmdb is a Python binding for LMDB including a bundled
    version of LMDB.
  doc_url: https://lmdb.readthedocs.io
  dev_url: https://github.com/jnwatson/py-lmdb

extra:
  recipe-maintainers:
    - pitrou
    - h-vetinari
    - xhochy
  skip-lints:
    - host_section_needs_exact_pinnings
